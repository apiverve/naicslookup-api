openapi: 3.0.4
info:
  title: NAICS Lookup
  description: >-
    NAICS Lookup is a NAICS code lookup and search API for the 2022 North
    American Industry Classification System. Look up one code or up to 500 at
    once, or search by keyword, and get the title, description, level, parent,
    hierarchy and children, while paid plans add the SBA small-business size
    standard, the Census index terms, cross-references and the 2017 concordance.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/naicslookup:
    get:
      summary: NAICS Lookup
      description: >-
        Look up NAICS 2022 codes (comma-separated for a batch) or search them by
        keyword
      operationId: naicslookup
      parameters:
        - name: code
          in: query
          schema:
            type: string
          required: false
          description: >-
            One NAICS code, or several separated by commas (up to 10 on Free,
            500 on paid plans)
          example: '541511'
        - name: search
          in: query
          schema:
            type: string
          required: false
          description: Keywords to search titles, index terms and descriptions
          example: software publisher
        - name: level
          in: query
          schema:
            type: integer
          required: false
          description: Only return codes at this level when searching (2 to 6 digits)
          example: 6
        - name: details
          in: query
          schema:
            type: boolean
          required: false
          description: Include index terms, cross-references and the NAICS 2017 concordance
          example: true
        - name: limit
          in: query
          schema:
            type: integer
          required: false
          description: Maximum search results (1-50)
          example: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  count: 1
                  results:
                    - code: '541511'
                      title: Custom Computer Programming Services
                      level: 6
                      levelName: national_industry
                      trilateral: false
                      description: >-
                        This U.S. industry comprises establishments primarily
                        engaged in writing, modifying, testing, and supporting
                        software to meet the needs of a particular customer.
                      parent:
                        code: '54151'
                        title: Computer Systems Design and Related Services
                      hierarchy:
                        - code: '54'
                          title: Professional, Scientific, and Technical Services
                          level: 2
                          levelName: sector
                        - code: '541'
                          title: Professional, Scientific, and Technical Services
                          level: 3
                          levelName: subsector
                        - code: '5415'
                          title: Computer Systems Design and Related Services
                          level: 4
                          levelName: industry_group
                        - code: '54151'
                          title: Computer Systems Design and Related Services
                          level: 5
                          levelName: industry
                        - code: '541511'
                          title: Custom Computer Programming Services
                          level: 6
                          levelName: national_industry
                      children: []
                      sizeStandard:
                        revenueMillions: 34
                        employees: null
                        summary: $34M average annual receipts
                        exceptions: []
                      indexTerms:
                        - >-
                          Applications software programming services, custom
                          computer
                        - Computer program or software development, custom
                        - Computer programming services, custom
                        - Computer software analysis and design services, custom
                        - Computer software programming services, custom
                        - Computer software support services, custom
                      crossReferences:
                        - text: >-
                            Software design, development, and publishing, or
                            software publishing only--are classified in Industry
                            513210, Software Publishers;
                          codes:
                            - '513210'
                        - text: >-
                            Providing computing infrastructure, data processing
                            services, Web hosting services (except software
                            publishing), and related services, including
                            streaming support services (except streaming
                            distribution services)--are classified in Industry
                            518210, Computing Infrastructure Providers, Data
                            Processing, Web Hosting, and Related Services; and
                          codes:
                            - '518210'
                        - text: >-
                            Planning and designing computer systems that
                            integrate computer hardware, software, and
                            communication technologies, even though such
                            establishments may provide custom software as an
                            integral part of their services--are classified in
                            U.S. Industry 541512, Computer Systems Design
                            Services.
                          codes:
                            - '541512'
                      naics2017:
                        - code: '541511'
                          title: Custom Computer Programming Services
                  notFound: []
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
